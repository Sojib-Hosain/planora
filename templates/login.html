{% extends 'base.html' %}
{% block title %}PLANORA | Login{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="glass auth-card">
    <a class="logo" href="{{ url_for('home') }}">PLANORA</a>
    <h1>Welcome back</h1>
    <p>Login to create bookings, manage your receipts and access the admin panel.</p>
    <form class="form-grid" method="post">
      <label>Email <input type="email" name="email" placeholder="Enter your email" required></label>
      <label>Password <input type="password" name="password" placeholder="Enter your password" required></label>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p><a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</main>
{% endblock %}
