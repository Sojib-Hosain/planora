{% extends 'base.html' %}
{% block title %}PLANORA | Register{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="glass auth-card">
    <a class="logo" href="{{ url_for('home') }}">PLANORA</a>
    <h1>Create account</h1>
    <p>Standard users can browse events, book tickets, cancel bookings and view their booking history.</p>
    <form class="form-grid" method="post">
      <label>Full name <input type="text" name="full_name" placeholder="Your full name" required></label>
      <label>Email <input type="email" name="email" placeholder="Enter your email" required></label>
      <label>Password <input type="password" name="password" placeholder="Enter your password" required></label>
      <label>Confirm password <input type="password" name="confirm_password" placeholder="Confirm your password" required></label>
      <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p><a href="{{ url_for('login') }}">Already have an account?</a></p>
  </section>
</main>
{% endblock %}
